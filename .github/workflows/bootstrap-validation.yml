name: Bootstrap Validation

# Tiered CI (see CI_CD_GUIDE.md):
# - validator + whitespace hygiene run on every event;
# - red checks + shell syntax run only when the diff touches a strict-gate
#   path (single pattern source: SCRIPTS/strict-gate-paths.sh), or on every
#   push to main and manual dispatch (fail-closed full suite).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bootstrap-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Optional self-hosted routing, off unless the repository sets variables
    # CI_TARGET=masterworker and MW_RUNNER_LABEL=<its enrolled runner label>.
    # Then pushes, dispatches and same-repository PRs use that runner; fork PRs
    # queue on a reserved never-registered label so untrusted code never runs on
    # the persistent runner and nothing falls back to paid compute. Without the
    # variables (e.g. scaffold copies) the standard hosted runner is used.
    runs-on: >-
      ${{ fromJSON(
        vars.CI_TARGET != 'masterworker' && '"ubuntu-latest"' ||
        ((github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
         format('["self-hosted","Linux","X64","masterworker","{0}"]', vars.MW_RUNNER_LABEL) ||
         '["self-hosted","masterworker-ci-blocked-do-not-register"]')) }}
    # Typical run is ~1.5 minutes (max observed 3.6); never hold a runner for 6 hours.
    timeout-minutes: 15
    steps:
      - name: Verify MasterWorker job lease
        if: vars.CI_TARGET == 'masterworker'
        run: /usr/bin/python3 /usr/local/lib/masterworker-ci/resource_gate.py verify-current-worker-lease

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history so the merge-base diff against the PR base is
          # computable without third-party actions.
          fetch-depth: 0

      - name: Validate bootstrap package
        run: bash SCRIPTS/validate-bootstrap.sh

      - name: Check whitespace hygiene
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          elif git rev-parse --quiet --verify 'HEAD~1' >/dev/null; then
            git diff --check 'HEAD~1' HEAD
          else
            echo "No parent commit; skipping whitespace diff check."
          fi

      - name: Decide validation scope
        id: scope
        run: |
          run_full=false
          reason=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            run_full=true
            reason="event=${{ github.event_name }} always runs the full suite"
          else
            changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null)" || changed=""
            if [ -z "$changed" ]; then
              run_full=true
              reason="could not compute changed files vs merge-base; failing closed to full suite"
            else
              match_status=0
              printf '%s\n' "$changed" | bash SCRIPTS/strict-gate-paths.sh --match || match_status=$?
              if [ "$match_status" -eq 0 ]; then
                run_full=true
                reason="changed files touch strict-gate paths (SCRIPTS/strict-gate-paths.sh)"
              elif [ "$match_status" -eq 1 ]; then
                reason="diff stays outside strict-gate paths; red checks and shell syntax skipped"
              else
                run_full=true
                reason="strict-gate-paths.sh exited $match_status (usage error or broken script); failing closed to full suite"
              fi
            fi
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "Scope decision: run_full=$run_full ($reason)"

      - name: Run bootstrap red checks
        if: steps.scope.outputs.run_full == 'true'
        run: bash SCRIPTS/validate-bootstrap-red-checks.sh

      - name: Check shell syntax
        if: steps.scope.outputs.run_full == 'true'
        run: |
          for script in SCRIPTS/*.sh .githooks/pre-commit .githooks/pre-push .githooks/commit-msg; do
            bash -n "$script"
          done
